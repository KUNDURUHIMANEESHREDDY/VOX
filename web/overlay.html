<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VOX</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.5/dist/livekit-client.umd.min.js"></script>
<style>
  /* Just a circle.
     No captions, no plate behind it, no glow. The desktop shows through
     everywhere the orb does not paint, so the only pixels on screen belong to
     the disc itself.

     Two states, carried by structure rather than by hue: a hollow ring means the
     agent holds no control, a filled disc means it does. That reads instantly
     and survives greyscale, which a red/teal colour swap does not.

     One accent, desaturated, and only ever in the armed state. */
  :root {
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --orb: 88px;
    --pad: 14px;
    /* Amber rather than the usual red-for-danger: the arm state is a status to
       read at a glance, not an alarm, and saturated red on a floating HUD is
       both garish and the thing every agent UI does by default. */
    --accent: 217 154 78;
    --rim-light: rgba(255, 255, 255, 0.55);
    --rim-dark: rgba(9, 10, 12, 0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Transparent well, sized to the orb plus breathing room for the halo ring
     that expands past the disc on loud audio. */
  .stage {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    background: transparent !important;
  }

  .orb {
    position: relative;
    width: var(--orb);
    height: var(--orb);
    border-radius: 50%;
    background: transparent !important;
    /* Only transform, so the drag stays on the compositor. */
    transition: transform 0.18s var(--ease-out);
    cursor: grab;
    touch-action: none;
  }
  .orb:active { cursor: grabbing; transform: scale(0.94); }
  .orb.dragging { transition: none; transform: scale(1.04); }

  /* Keyboard reachability: the orb is a button, so it must be focusable and
     show where it is. The ring is a child, so it does not clip the outline. */
  .orb:focus { outline: none; }
  .orb:focus-visible .ring { opacity: 1; }
  .ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.75);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s linear;
  }

  /* The canvas is authored at 2x for a crisp edge on a HiDPI display, so it has
     to be scaled down to the orb or it overflows the window and the disc gets
     clipped to a quadrant. */
  canvas {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    background: transparent !important;
  }

  /* Screen-reader-only label. Never painted, so it cannot break the
     transparency the whole thing depends on. */
  .sr {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .orb, .ring { transition: none !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="orb" id="orb" role="button" tabindex="0" aria-pressed="false"
       aria-label="VOX, disarmed. Activate to disarm.">
    <span class="ring" aria-hidden="true"></span>
    <canvas id="disc" width="176" height="176" aria-hidden="true"></canvas>
    <span class="sr" id="live" role="status" aria-live="polite"></span>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const orb = $("orb");
  const canvas = $("disc");
  const ctx = canvas.getContext("2d");
  const stage = $("stage");
  const live = $("live");

  let room = null;
  let audioCtx = null;
  let userAmp = 0;
  let botAmp = 0;
  let armed = false;
  let connected = false;
  // Ambient drift for the idle shimmer. Frozen under reduced motion so the disc
  // is genuinely still when nobody is speaking.
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let phase = 0;
  let last = performance.now();

  const api = () =>
    (window.pywebview && window.pywebview.api) || null;

  // The window no longer grows and shrinks, so it is sized once to the orb plus
  // its padding. Measuring content would resize the native window mid-drag.
  function fitWindow() {
    const bridge = api();
    if (bridge && typeof bridge.fit === "function") {
      const rect = stage.getBoundingClientRect();
      bridge.fit(Math.ceil(rect.width), Math.ceil(rect.height));
    }
  }

  // ------------------------------------------------------------------ drawing

  function paint(now) {
    const dt = Math.min((now - last) / 16.67, 3);
    last = now;

    // Amplitudes decay on their own so the disc settles when speech stops,
    // instead of snapping back the frame the audio ends.
    userAmp *= Math.pow(0.9, dt);
    botAmp *= Math.pow(0.9, dt);
    const level = Math.min(1, Math.max(userAmp, botAmp) * 1.6);
    if (!reduceMotion.matches) phase += 0.016 * dt;

    const w = canvas.width;
    const h = canvas.height;
    const cx = w / 2;
    const cy = h / 2;
    const r = w * 0.36 * (1 + level * 0.1);

    ctx.clearRect(0, 0, w, h);

    // Halo: one expanding ring, opacity tied to how loud it is. At rest it is
    // fully transparent, so the idle orb is just the disc and nothing else.
    if (level > 0.02) {
      const halo = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.5);
      halo.addColorStop(0, `rgba(${armed ? "217,154,78" : "255,255,255"},${0.16 * level})`);
      halo.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();

    // Body. Disarmed is nearly empty so the wallpaper reads straight through
    // the middle; armed is filled. That difference is the safety signal.
    const body = ctx.createRadialGradient(
      cx, cy - r * 0.35, r * 0.1,
      cx, cy, r
    );
    if (armed) {
      body.addColorStop(0, "rgb(232 176 108)");
      body.addColorStop(1, "rgb(176 118 56)");
    } else {
      body.addColorStop(0, "rgba(255, 255, 255, 0.13)");
      body.addColorStop(0.72, "rgba(255, 255, 255, 0.05)");
      body.addColorStop(1, "rgba(255, 255, 255, 0.02)");
    }
    ctx.fillStyle = body;
    ctx.fillRect(0, 0, w, h);

    if (level > 0.02) {
      // A slow off-centre bloom so loud speech looks like it is coming from
      // somewhere inside the disc rather than being a flat flash.
      const bloom = ctx.createRadialGradient(
        cx + Math.cos(phase) * r * 0.3,
        cy + Math.sin(phase * 0.7) * r * 0.3,
        0,
        cx, cy, r
      );
      bloom.addColorStop(0, `rgba(255,255,255,${0.3 * level})`);
      bloom.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = bloom;
      ctx.fillRect(0, 0, w, h);
    }
    ctx.restore();

    // Edge. A light top edge and a dark bottom edge give the disc a physical
    // lip, which is what keeps it legible on a white wallpaper as well as a
    // dark one. Without it the orb disappears into a light background.
    ctx.beginPath();
    ctx.arc(cx, cy, r - 0.75, 0, Math.PI * 2);
    const rim = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
    rim.addColorStop(0, `rgba(255, 255, 255, ${0.42 + level * 0.3})`);
    rim.addColorStop(0.5, "rgba(255, 255, 255, 0.06)");
    rim.addColorStop(1, "rgba(9, 10, 12, 0.5)");
    ctx.strokeStyle = rim;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function draw(now) {
    requestAnimationFrame(draw);
    paint(now);
  }

  // ------------------------------------------------------------------- state

  function renderSafety(state) {
    if (!state) return;
    armed = !!state.armed;
    orb.setAttribute("aria-pressed", armed ? "true" : "false");
    orb.setAttribute(
      "aria-label",
      armed
        ? "VOX, armed. It can control this computer. Activate to disarm now."
        : "VOX, disarmed. Activate to disarm."
    );
    live.textContent = armed
      ? "Armed. VOX can control this computer."
      : "Disarmed.";
  }

  async function disarm() {
    try {
      const res = await fetch("/api/disarm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
      });
      const data = await res.json();
      if (data && data.state) renderSafety(data.state);
    } catch (e) {
      console.warn("Disarm call failed:", e);
    }
  }

  // ------------------------------------------------------------- drag / tap

  // A drag and a click come from the same gesture, so they are separated by
  // distance rather than by which event fires. Anything under 4px of travel is
  // a tap, and a tap is the panic button -- it must never be swallowed by a
  // drag that started a pixel early.
  const TAP_SLOP = 4;
  let pointerId = null;
  let grabX = 0;
  let grabY = 0;
  let winX = 0;
  let winY = 0;
  let dragging = false;

  orb.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const bridge = api();
    const pos = bridge && bridge.position ? bridge.position() : null;
    if (!pos || pos.length !== 2) return;
    pointerId = e.pointerId;
    // Screen coordinates, not client ones: the window follows the pointer, so
    // window-relative coordinates freeze the moment the drag starts.
    grabX = e.screenX;
    grabY = e.screenY;
    winX = pos[0];
    winY = pos[1];
    dragging = false;
    try { orb.setPointerCapture(e.pointerId); } catch (_) {}
  });

  orb.addEventListener("pointermove", (e) => {
    if (pointerId === null || e.pointerId !== pointerId) return;
    const travel = Math.hypot(e.screenX - grabX, e.screenY - grabY);
    if (!dragging && travel > TAP_SLOP) {
      dragging = true;
      orb.classList.add("dragging");
    }
    if (!dragging) return;
    const bridge = api();
    if (!bridge || typeof bridge.move_to !== "function") return;
    const res = bridge.move_to(winX + (e.screenX - grabX), winY + (e.screenY - grabY));
    // Adopt the clamped position so hitting a screen edge stops the orb
    // sliding away from the cursor for the rest of the gesture.
    if (res && res.length === 2) {
      winX = res[0];
      winY = res[1];
    }
  });

  function endPointer(e) {
    if (pointerId === null || e.pointerId !== pointerId) return;
    try { orb.releasePointerCapture(e.pointerId); } catch (_) {}
    pointerId = null;
    orb.classList.remove("dragging");
    if (!dragging) disarm();
    dragging = false;
  }

  orb.addEventListener("pointerup", endPointer);
  orb.addEventListener("pointercancel", endPointer);

  // Keyboard parity: Enter and Space are what a button answers to, and this is
  // a button.
  orb.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      disarm();
    }
  });

  // ------------------------------------------------------------------ audio

  function setupAudioAnalyzer(mediaStreamTrack, isUser) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const source = audioCtx.createMediaStreamSource(new MediaStream([mediaStreamTrack]));
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      source.connect(analyser);

      const buffer = new Uint8Array(analyser.frequencyBinCount);
      const sample = () => {
        analyser.getByteFrequencyData(buffer);
        let sum = 0;
        for (let i = 0; i < buffer.length; i++) sum += buffer[i];
        const val = sum / (buffer.length * 255);
        if (isUser) userAmp = Math.max(userAmp, val);
        else botAmp = Math.max(botAmp, val);
        requestAnimationFrame(sample);
      };
      sample();
    } catch (e) {
      console.warn("Audio analysis unavailable:", e);
    }
  }

  // ------------------------------------------------------------------- boot

  async function init() {
    // Paint once synchronously so the disc is on screen immediately rather than
    // after the first animation frame, then hand over to the loop. A window that
    // flashes empty for a frame reads as a bug on a HUD you glance at.
    paint(performance.now());
    requestAnimationFrame(draw);
    fitWindow();

    fetch("/api/safety").then((r) => r.json()).then(renderSafety).catch(() => {});
    setInterval(() => {
      fetch("/api/safety").then((r) => r.json()).then(renderSafety).catch(() => {});
    }, 3000);

    try {
      const res = await fetch("/api/connect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: "overlay" }),
      });
      if (!res.ok) return;
      const data = await res.json();
      room = new LivekitClient.Room({ adaptiveStream: true });
      await room.connect(data.url, data.token, { autoSubscribe: true });
      connected = true;
      orb.setAttribute(
        "aria-label",
        (armed ? "VOX, armed." : "VOX, disarmed.") + " Connected."
      );

      room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === "audio") setupAudioAnalyzer(track.mediaStreamTrack, false);
      });

      // Only the safety channel is read now. The assistant transcript is not
      // rendered: the disc is the whole interface.
      room.on(LivekitClient.RoomEvent.DataReceived, (payload, _p, _k, topic) => {
        if (topic !== "vox") return;
        try {
          const msg = JSON.parse(new TextDecoder().decode(payload));
          if (msg.type === "safety") renderSafety(msg.state);
        } catch (_) { /* a malformed packet is not worth surfacing */ }
      });

      if (room.localParticipant) {
        room.localParticipant.tracks.forEach((publication) => {
          if (publication.track && publication.track.kind === "audio") {
            setupAudioAnalyzer(publication.track.mediaStreamTrack, true);
          }
        });
      }
    } catch (err) {
      console.debug("Overlay connection idle:", err);
    }

    fitWindow();
  }

  window.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
