name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual real-model speech runs must not cancel the ordinary PR verification run.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'ci' }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows install, dependency and test gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the application
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit installed dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --progress-spinner off --skip-editable

      - name: Compile application and tests
        run: python -m compileall -q src tests

      - name: Run unit and safety tests
        run: python -m pytest -q -ra

  # Exercise request framing, size limits and model contract validation without
  # downloading the large Whisper/Piper runtime models.
  speech-contract:
    name: Local speech API contract and request limits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lightweight contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.110,<1" "python-multipart>=0.0.9,<1" "httpx>=0.27,<1" "pytest>=8,<9" "pytest-asyncio>=0.23,<2"

      - name: Audit lightweight speech API dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --progress-spinner off --skip-editable

      - name: Test bounded request handling and explicit API contracts
        run: python -m pytest -q tests/test_local_speech_contract.py

  # Real model round-trip is expensive and downloads ~200 MB of models, so it
  # is deliberately opt-in through workflow_dispatch rather than silently
  # skipped on every ordinary CI run.
  speech-integration:
    name: Optional real-model STT/TTS round-trip
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install speech runtime and test tools
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[speech]" pytest pytest-asyncio pip-audit
          python -m pip check
          python -m pip_audit --progress-spinner off --skip-editable

      - name: Download pinned Piper voice model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .data/models
          revision="b145f2ac26522d6a2ccde0164b7b0e48b1e3199c"
          base="https://huggingface.co/rhasspy/piper-voices/resolve/${revision}/en/en_US/lessac/medium"
          curl --fail --location --retry 3 "${base}/en_US-lessac-medium.onnx" -o .data/models/en_US-lessac-medium.onnx
          echo "5efe09e69902187827af646e1a6e9d269dee769f9877d17b16b1b46eeaaf019f  .data/models/en_US-lessac-medium.onnx" | sha256sum --check
          curl --fail --location --retry 3 "${base}/en_US-lessac-medium.onnx.json" -o .data/models/en_US-lessac-medium.onnx.json
          python -m json.tool .data/models/en_US-lessac-medium.onnx.json > /dev/null

      - name: Run real speech model round-trip tests
        run: python -m pytest -vv -ra --junitxml=speech-integration.xml tests/test_local_speech.py

      - name: Preserve real speech test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vox-speech-integration-${{ github.run_id }}
          path: speech-integration.xml
          if-no-files-found: warn
          retention-days: 7
